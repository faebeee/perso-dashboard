[package]
name = "productivity-dashboard"
version = "0.1.0"
description = "Personal productivity dashboard"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "productivity_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# unsafe-headers: lets requests drop the webview Origin header (see ../src/host/fetch.ts)
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
# Needed by tauri::generate_context! for plugin config (plugins.http.scopeRedirects).
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
